<section class="completed-courses">
  <h3>Cursos completados</h3>

  @if (completedCourses.length === 0) {
    <p class="empty-text">
      Aún no has completado ningún curso
    </p>
  }

  <div class="course-list">
    @for (course of completedCourses; track course.id) {
      <div class="course-card completed">

        <div class="card-header">
          <h4>{{ course.title }}</h4>
          <span class="badge success">Aprobado</span>
        </div>

        <p>{{ course.description }}</p>

        <button class="certificate-btn" (click)="viewCertificate(course)">
          Ver certificado
        </button>

      </div>
    }
  </div>
</section>
