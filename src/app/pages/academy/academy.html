<div class="academy-container">
   <div class="academy-text">
    <h2>
      Bienvenido a tu Academia ProScience,
      <span class="user-name">{{ user?.firstName }}</span>
    </h2>
    <p class="academy-subtitle">
      Continúa tu proceso de formación y certificación
    </p>
  </div>

  <div class="academy-video">
    <iframe
      src="https://www.youtube.com/embed/JXc9iQXRMLg?autoplay=1&mute=1&loop=1&playlist=JXc9iQXRMLg"
      allow="autoplay; encrypted-media">
    </iframe>
  </div>

  <div class="doc-trainings">
    <h3>Capacitaciones con el Doc Wilson Martinez</h3>

    <div class="doc-videos">
    @for (v of loadedVideos; track v) {
      <div class="video-wrapper">
        <iframe
          [src]="v | safeUrl"
          loading="lazy"
          allowfullscreen>
        </iframe>
      </div>
    }
    </div>

    <div #infiniteTrigger style="height: 40px; width: 100%;"></div>
  </div>
</div>
